services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mockexam-app
    restart: always
    environment:
      - DATABASE_URL=postgres://mockexam_user:mockexam_secure_pass@db:5432/mockexam
      - NEXTAUTH_URL=https://mocks.malaylayek.work.gd
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-mockexam_pro_production_secret_key_change_me}
      - MOCKEXAM_API_KEY=${MOCKEXAM_API_KEY:-mockexam_mcp_secret_token_change_me}
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mockexam-net
      - default

  db:
    image: postgres:16-alpine
    container_name: mockexam-db
    restart: always
    environment:
      - POSTGRES_USER=mockexam_user
      - POSTGRES_PASSWORD=mockexam_secure_pass
      - POSTGRES_DB=mockexam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockexam_user -d mockexam"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mockexam-net

volumes:
  pgdata:
    driver: local

networks:
  default:
    external: true
    name: npm-network
  mockexam-net:
    driver: bridge
